<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reisinger — Pitch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;600;700&display=swap">
<style>
* { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
:root { --paper:#f7f4ef; --ink:#1c1a17; --brand:#1c3a54; --brand-deep:#132838;
  --pop:#c8401f; --done:#2e6b3a; --card:#fffdf9; --line:rgba(28,58,84,.14); }
html, body { height:100%; }
body { background:var(--paper); color:var(--ink); font:400 16px/1.5 Inter,system-ui,sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px; display:flex; flex-direction:column; overscroll-behavior:none; }

/* picker */
#pick { padding:2rem clamp(1rem,4vw,3rem); overflow-y:auto; }
#pick h1 { font:900 clamp(2rem,5vw,3.2rem)/1 Archivo; text-transform:uppercase; margin-bottom:1.2rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem; }
.pt { display:flex; flex-direction:column; align-items:center; gap:.6rem; padding:1.2rem .8rem 1rem;
  background:var(--card); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
  font:800 .95rem/1.2 Inter; color:var(--ink); cursor:pointer; text-align:center; min-height:44px; }
.pt:active { transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink); }
.pt img { width:72px; height:72px; object-fit:contain; }
.pt .mono { width:72px; height:72px; display:grid; place-items:center; background:var(--brand);
  color:#fff; font:900 1.6rem Archivo; }
.pt small { font:600 .72rem/1 Inter; color:rgba(28,26,23,.6); text-transform:uppercase; letter-spacing:.08em; }

/* stage */
#stage { display:none; flex:1; flex-direction:column; min-height:0; }
.bar { display:flex; align-items:stretch; gap:.6rem; padding:.7rem .8rem; background:var(--ink); }
.bar button { font:900 clamp(.9rem,2.2vw,1.25rem)/1 Archivo; text-transform:uppercase; letter-spacing:.03em;
  border:3px solid #fff3; background:transparent; color:#fff; padding:.9rem 1rem; cursor:pointer;
  flex:1; min-height:56px; }
.bar button.on { background:var(--pop); border-color:var(--pop); }
.bar .back { flex:0 0 auto; background:#fff; color:var(--ink); border-color:#fff; font-size:1rem; }
.panes { flex:1; position:relative; min-height:0; }
.pane { position:absolute; inset:0; display:none; }
.pane.on { display:block; }
.pane iframe { width:100%; height:100%; border:0; background:#fff; }
.holder { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1rem; text-align:center; padding:2rem; }
.holder h2 { font:900 clamp(1.6rem,4vw,2.6rem)/1.1 Archivo; text-transform:uppercase; max-width:22ch; }
.holder p { color:rgba(28,26,23,.65); max-width:46ch; }
.openbtn { position:absolute; right:.9rem; bottom:.9rem; z-index:5; font:800 .8rem/1 Inter;
  background:var(--ink); color:#fff; padding:.7rem 1rem; border:0; box-shadow:4px 4px 0 rgba(0,0,0,.3);
  text-decoration:none; min-height:44px; display:inline-flex; align-items:center; }
/* formats pane */
#p-fmt { overflow-y:auto; padding:1.6rem clamp(1rem,4vw,3rem) 3rem; }
#p-fmt h2 { font:900 clamp(1.5rem,3.5vw,2.4rem)/1.05 Archivo; text-transform:uppercase; margin-bottom:.4rem; }
#p-fmt .sub { font:700 1.05rem/1.4 Inter; color:var(--done); margin-bottom:1.2rem; }
.fcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.1rem; }
.fc { background:var(--card); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:1.2rem 1.3rem; }
.fc b { display:block; font:900 1.15rem/1.2 Archivo; text-transform:uppercase; color:var(--brand-deep); margin-bottom:.5rem; }
.fc p { font-size:.95rem; }
.ex { margin-top:1.4rem; display:flex; flex-wrap:wrap; gap:.7rem; }
.ex a { font:800 .9rem/1 Inter; background:var(--brand); color:#fff; padding:.85rem 1.1rem;
  text-decoration:none; box-shadow:4px 4px 0 var(--ink); min-height:44px; display:inline-flex; align-items:center; }
</style>
</head>
<body>
<div id="pick">
  <h1>Who are we sitting with?</h1>
  <div class="grid" id="grid"></div>
</div>
<div id="stage">
  <div class="bar">
    <button class="back" onclick="goPick()">&larr;</button>
    <button id="b-old" onclick="show('old')">Your site now</button>
    <button id="b-new" onclick="show('new')">The new site</button>
    <button id="b-fmt" onclick="show('fmt')">Your content</button>
  </div>
  <div class="panes">
    <div class="pane" id="p-old"></div>
    <div class="pane" id="p-new"></div>
    <div class="pane" id="p-fmt"></div>
  </div>
</div>
<script>
const CLIENTS = [{"slug": "backdraft-excavating", "name": "Backdraft Excavating", "trade": "excavating", "logo": "../backdraft-excavating/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/backdraft-excavating/", "formats": [], "examples": []}, {"slug": "double-b-farm-supply", "name": "Double B Farm Supply", "trade": "dealer", "logo": "../bb-v4/img/logo.png", "old": "https://www.doublebequip.com/", "new": "https://cutsbyg.github.io/natty-previews/bb-v4/", "formats": [{"t": "1 \u00b7 One-Man Catch", "b": "Close-up \u2014 the head gate CATCHES an animal in the first second \u2192 the mechanism working \u2192 one real job (tag, pour-on, check) \u2192 the calm walk-out, never cut short \u2192 site + phone. One man. No performing. It's the structure behind the biggest ag channel on earth."}, {"t": "2 \u00b7 Why She Won't Go In", "b": "Open on cattle balking \u2192 Mike shows the ONE cause (shadow, footing, angle) \u2192 fixes it on camera \u2192 same shot, cattle flowing clean \u2192 \"we'll come look at your setup.\""}, {"t": "3 \u00b7 Answer On The Metal", "b": "A real customer question on screen \u2192 Mike answers with his hands on the steel \u2192 honest yes or no \u2192 \"questions like this, just call.\" Works alone, any weather, no cattle needed \u2014 the daily filler."}], "examples": [{"label": "The formula at 4.7M subs (Hoof GP)", "url": "https://www.youtube.com/@TheHoofGP"}, {"label": "Arrowquip chute tour that pulled", "url": "https://www.tiktok.com/@bar7ranch/video/7296167730544135470"}, {"label": "'Even kids can use it' reel", "url": "https://www.instagram.com/reel/C7ZU2IgimQ6/"}]}, {"slug": "encore-roofing", "name": "Encore Roofing", "trade": "roofing", "logo": "../encore-v3/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/encore-v3/", "formats": [], "examples": []}, {"slug": "hurley", "name": "Hurley", "trade": "\u2014", "logo": "../hurley/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/hurley/", "formats": [], "examples": []}, {"slug": "jameson-tree-pruners", "name": "Jameson Tree Pruners", "trade": "tree", "logo": "../jameson-tree-pruners/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/jameson-tree-pruners/", "formats": [], "examples": []}, {"slug": "qnc-construction", "name": "QnC Construction", "trade": "custom homes", "logo": "../qnc/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/qnc/", "formats": [], "examples": []}, {"slug": "wsl-incorporated", "name": "WSL Incorporated", "trade": "design-build", "logo": "../wsl/img/logo.png", "old": "", "new": "https://cutsbyg.github.io/natty-previews/variant-01/", "formats": [], "examples": []}, {"slug": "boyer-s-tree-service", "name": "Boyer's Tree Service", "trade": "tree", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "burkholder-lawn-care", "name": "Burkholder Lawn Care", "trade": "lawn", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "command-site-contractors", "name": "Command Site Contractors", "trade": "excavating/gc", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "compy-s-landscaping", "name": "Compy's Landscaping", "trade": "landscape", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "d-and-e-auto-body", "name": "D & E Auto Body", "trade": "auto body", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "jp-construction-services", "name": "JP Construction Services", "trade": "roofing/gc", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "jones-construction-and-lawn", "name": "Jones Construction & Lawn", "trade": "gc/lawn", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "lauvers-custom-construction", "name": "Lauvers Custom Construction", "trade": "gc/exteriors", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "martin-enterprises", "name": "Martin Enterprises", "trade": "electrical/plumbing", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "mill-auto", "name": "Mill Auto", "trade": "auto/tires", "logo": "", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "timber-and-beyond", "name": "Timber & Beyond", "trade": "tree", "logo": "../timber-and-beyond/img/logo.png", "old": "", "new": "", "formats": [], "examples": []}, {"slug": "twin-mar-roofing", "name": "Twin Mar Roofing", "trade": "roofing", "logo": "../twin-mar-roofing/img/logo.png", "old": "", "new": "", "formats": [], "examples": []}];
let cur = null;
const grid = document.getElementById('grid');
grid.innerHTML = CLIENTS.map((c,i) =>
  `<button class="pt" onclick="open_(${i})">` +
  (c.logo ? `<img src="${c.logo}" alt="">` : `<span class="mono">${c.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`) +
  `<span>${c.name}</span><small>${c.trade || ''}</small></button>`).join('');
function frame(url, label) {
  if (!url) return '';
  return `<iframe src="${url}" loading="lazy"></iframe>` +
         `<a class="openbtn" href="${url}" target="_blank" rel="noopener">Open ${label} ↗</a>`;
}
function open_(i) {
  cur = CLIENTS[i];
  document.getElementById('p-old').innerHTML = cur.old
    ? frame(cur.old, 'their site')
    : `<div class="holder"><h2>No website found.</h2><p>Right now, someone searching for ${cur.name} finds nothing. That is the whole problem — and it's already fixed on the next tab.</p></div>`;
  document.getElementById('p-new').innerHTML = cur.new
    ? frame(cur.new, 'new site')
    : `<div class="holder"><h2>Being built.</h2><p>The new site isn't deployed yet for this one.</p></div>`;
  const fm = cur.formats || [];
  document.getElementById('p-fmt').innerHTML =
    `<h2>Content that already works in your world</h2>` +
    `<p class="sub">You record on your phone. We edit it, caption it, and post it for you — free for your first month.</p>` +
    (fm.length
      ? `<div class="fcards">` + fm.map(f =>
          `<div class="fc">` + (f.t ? `<b>${f.t}</b>` : ``) + `<p>${f.b}</p></div>`).join('') + `</div>`
      : `<div class="holder"><h2>Researched the day you say yes.</h2><p>We dig through what's actually pulling views in your trade and hand you the exact repeatable formats.</p></div>`) +
    ((cur.examples || []).length
      ? `<div class="ex">` + cur.examples.map(e => `<a href="${e.url}" target="_blank" rel="noopener">${e.label} ↗</a>`).join('') + `</div>`
      : ``);
  document.getElementById('pick').style.display = 'none';
  document.getElementById('stage').style.display = 'flex';
  show(cur.old ? 'old' : 'new');
}
function show(k) {
  for (const x of ['old','new','fmt']) {
    document.getElementById('p-' + x).classList.toggle('on', x === k);
    document.getElementById('b-' + x).classList.toggle('on', x === k);
  }
}
function goPick() {
  document.getElementById('stage').style.display = 'none';
  document.getElementById('pick').style.display = 'block';
}
</script>
</body>
</html>
