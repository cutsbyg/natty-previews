  (groups[p.chunk] = groups[p.chunk] || []).push(m);
  m.addTo(map);
});
const bar = document.getElementById('chunkbar');
Object.keys(groups).sort((a, b) => a - b).forEach(k => {
  const ms = groups[k];
  const lat = ms.reduce((s, m) => s + m.getLatLng().lat, 0) / ms.length;
  const lng = ms.reduce((s, m) => s + m.getLatLng().lng, 0) / ms.length;
  L.marker([lat, lng], {icon: L.divIcon({className: '', html:
    '<span class="chunklabel">C' + k + '</span>'})}).addTo(map);
  const b = document.createElement('button');
  b.textContent = 'Chunk ' + k + ' (' + ms.length + ')';
  b.onclick = () => map.fitBounds(L.featureGroup(ms).getBounds().pad(0.3));
  bar.appendChild(b);
});
</script></body></html>
