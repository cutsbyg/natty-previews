<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website analytics</title>
<style>
  :root{--brand:#338024;--deep:#245c1a;--paper:#f7f4ef;--ink:#1c1a17;--mut:#6b6862;--gold:#f2a900}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font:16px "Segoe UI",system-ui,sans-serif;
       min-height:100vh;padding:2rem 1rem}
  .wrap{max-width:56rem;margin:0 auto}
  h1{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800}
  .sub{color:var(--mut);margin-top:.2rem}
  .live{display:inline-flex;align-items:center;gap:.45rem;margin-top:.4rem;color:var(--deep);font-weight:700;font-size:.9rem}
  .live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);
                animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin:1.6rem 0}
  .tile{background:#fff;border-radius:12px;padding:1rem 1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .tile b{display:block;font-size:2rem;font-variant-numeric:tabular-nums}
  .tile span{color:var(--mut);font-size:.85rem}
  h2{font-size:1.1rem;margin:1.6rem 0 .6rem}
  .chart{background:#fff;border-radius:12px;padding:1rem;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow-x:auto}
  .chart svg{display:block;min-width:560px;width:100%;height:auto}
  .err{background:#fff3f0;border-left:3px solid #c0392b;padding:.8rem 1rem;border-radius:6px;margin-top:1.4rem;display:none}
  .foot{margin-top:2rem;color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <p><a id="back" href="../" style="color:var(--deep);font-weight:700;text-decoration:none">&larr; Back to the website</a></p>
  <h1 id="title">Website analytics</h1>
  <p class="sub" id="sub">First-party. No cookies, nothing sold, counted on our own machine.</p>
  <p class="live">LIVE — updates every 60 seconds</p>
  <div class="tiles" id="tiles"></div>
  <h2>Visits by day</h2>
  <div class="chart" id="chart"></div>
  <p class="err" id="err">Can't reach the counter right now — the numbers are safe, this page just can't fetch them at the moment. Try again in a minute.</p>
  <p class="foot" id="foot"></p>
</div>
<script>
(function(){
  'use strict';
  var site = new URLSearchParams(location.search).get('site') || 'bb-v4';
  var NAMES = {'bb-v4':'Double B Farm Supply','backdraft-excavating':'Backdraft Excavating',
    'boyers-tree-service':"Boyer's Tree Service",'command-site':'Command Site Contractors',
    'encore':'Encore Roofing','jameson-tree-pruners':'Jameson Tree Pruners',
    'jones-construction':'Jones Construction & Lawn','lauvers-custom-construction':"Lauver's Custom Construction",
    'timber-and-beyond-tree':'Timber & Beyond Tree Service','twin-mar-roofing':'Twin Mar Roofing'};
  document.getElementById('title').textContent = (NAMES[site]||site) + ' — website analytics';
  document.getElementById('back').href = '../' + site + '/';
  var LABELS = {'Visit':'Visits','Reached CTA':'Reached the pricing form','Quote request':'Pricing requests',
                'Call':'Call taps','Directions':'Direction taps','Work viewed':'Products viewed','Add to project':'Added to a project'};
  var ORDER = ['Visit','Work viewed','Add to project','Reached CTA','Quote request','Call','Directions'];

  function draw(d){
    document.getElementById('err').style.display='none';
    var t = document.getElementById('tiles'); t.innerHTML='';
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function tile(big, label){
      var el = document.createElement('div'); el.className='tile';
      el.innerHTML = '<b>'+esc(big)+'</b><span>'+esc(label)+'</span>';
      t.appendChild(el);
    }
    ORDER.forEach(function(k){ if (k in d.totals) tile(d.totals[k], LABELS[k]||k); });
    Object.keys(d.totals).forEach(function(k){
      if (ORDER.indexOf(k)<0) tile(d.totals[k], LABELS[k]||k);
    });
    /* computed tiles: avg time on site, conversion, most popular action */
    if (d.dwell && d.dwell.n){
      var avg = Math.round(d.dwell.sum/d.dwell.n);
      tile(avg>=60 ? Math.floor(avg/60)+'m '+(avg%60)+'s' : avg+'s', 'Avg. time on site');
    }
    var vis = d.totals['Visit']||0, qr = d.totals['Quote request']||0;
    if (vis) tile((100*qr/vis).toFixed(1)+'%', 'Conversion — visits to pricing requests');
    var CLICKS = ['Call','Directions','Add to project','Work viewed'], top = null;
    CLICKS.forEach(function(k){ if (d.totals[k] && (!top || d.totals[k]>d.totals[top])) top = k; });
    if (top) tile(d.totals[top], 'Most popular action — '+LABELS[top]);
    /* line graph, last 30 days, oldest left */
    var days=[], now=new Date();
    for (var i=29;i>=0;i--){
      var dt=new Date(now); dt.setDate(now.getDate()-i);
      days.push(dt.toISOString().slice(0,10));
    }
    var counts = days.map(function(day){
      return (d.days[day]||{})['Visit'] || 0;   // the heading says Visits — count only visits
    });
    var W=720, H=200, PAD_L=34, PAD_R=14, PAD_T=16, PAD_B=30;
    var max = Math.max.apply(null, counts.concat([4]));
    function X(i){ return PAD_L + i*(W-PAD_L-PAD_R)/(days.length-1); }
    function Y(n){ return PAD_T + (1-n/max)*(H-PAD_T-PAD_B); }
    var pts = counts.map(function(n,i){ return X(i).toFixed(1)+','+Y(n).toFixed(1); });
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    /* faint grid + y labels */
    var steps = Math.min(4, max);
    for (var g=0; g<=steps; g++){
      var v = Math.round(max*g/steps), y = Y(v).toFixed(1);
      svg += '<line x1="'+PAD_L+'" y1="'+y+'" x2="'+(W-PAD_R)+'" y2="'+y+'" stroke="#eceade" stroke-width="1"/>';
      svg += '<text x="'+(PAD_L-8)+'" y="'+y+'" font-size="10" fill="#6b6862" text-anchor="end" dominant-baseline="middle">'+v+'</text>';
    }
    /* area fill under the line */
    svg += '<polygon points="'+X(0).toFixed(1)+','+Y(0).toFixed(1)+' '+pts.join(' ')+' '+X(days.length-1).toFixed(1)+','+Y(0).toFixed(1)+'" fill="rgba(51,128,36,.12)"/>';
    /* the line */
    svg += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#338024" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    /* dots on non-zero days, emphasized endpoint */
    counts.forEach(function(n,i){
      if (n) svg += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(n).toFixed(1)+'" r="3.2" fill="#338024"/>';
    });
    svg += '<circle cx="'+X(days.length-1).toFixed(1)+'" cy="'+Y(counts[counts.length-1]).toFixed(1)+'" r="4.5" fill="#245c1a" stroke="#fff" stroke-width="1.5"/>';
    /* x labels every 5 days */
    days.forEach(function(day,i){
      if (i%5===0 || i===days.length-1)
        svg += '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#6b6862" text-anchor="middle">'+day.slice(5)+'</text>';
    });
    svg += '</svg>';
    document.getElementById('chart').innerHTML = svg;
    document.getElementById('foot').textContent =
      'Counted from '+ Object.keys(d.days).sort()[0] +' · updated '+ new Date(d.generated*1000).toLocaleString();
  }

  function tick(){
    fetch('../analytics.json', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(c){ return fetch(c.url + '/stats/' + site, {cache:'no-store'}); })
      .then(function(r){ return r.json(); })
      .then(draw)
      .catch(function(){ document.getElementById('err').style.display='block'; });
  }
  tick(); setInterval(tick, 60000);
})();
</script>
</body>
</html>
